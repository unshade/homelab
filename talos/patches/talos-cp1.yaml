machine:
  network:
    interfaces:
      # Deliberately left in place, no longer carrying the default route -
      # purely a rollback path if ens19/the new network ever has a problem.
      # Genuinely, fully inert now: cluster.apiServer.extraArgs in
      # common.yaml pins both service-account-issuer and api-audiences to
      # kubernetes.default.svc.cluster.local, so nothing about this address
      # is load-bearing for tokens anymore either (it briefly was, for
      # api-audiences specifically, between the two incidents documented in
      # router/README.md's Cutover checklist Phase 3 - not anymore). Safe to
      # remove entirely for a full cutover matching w-1/pve0, whenever
      # that's actually wanted - nothing currently depends on it.
      - interface: ens18
        addresses:
          - 192.168.1.252/24
        dhcp: false
      # New network (10.200.0.0/24, behind the Mikrotik) - now the primary
      # interface: carries both the default route and the WireGuard-subnet
      # route added earlier (10.200.255.0/24 - a *different* subnet from the
      # LAN this interface is directly connected to, so still needs its own
      # explicit route even now that the default route also lives here).
      - interface: ens19
        addresses:
          - 10.200.0.52/24
        dhcp: false
        routes:
          - network: 0.0.0.0/0
            gateway: 10.200.0.1
          - network: 10.200.255.0/24
            gateway: 10.200.0.1
    nameservers:
      - 10.200.0.1
      - 1.1.1.1
      - 1.0.0.1
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: talos-cp1
