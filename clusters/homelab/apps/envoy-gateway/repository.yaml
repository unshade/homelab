---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: gateway-helm
  namespace: envoy-gateway-system
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  # Exact version, not a semver range: Renovate's flux manager bumps this
  # tag through a PR like every other chart in the repo (a range let Flux
  # roll patches in silently but never surfaced a new minor - v1.8 reached
  # EOL unnoticed). Before merging a minor bump, read the release's
  # "breaking changes" notes and check the Kubernetes version against
  # https://gateway.envoyproxy.io/news/releases/matrix/.
  ref:
    tag: v1.10.0
    digest: sha256:dcb82a14c04b426615a71d97222c7edf9f5ff58b800d241e71ac5784ae6dc7b7
