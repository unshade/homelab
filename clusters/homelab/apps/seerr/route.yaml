---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Seerr
    gethomepage.dev/description: Media request manager
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyseerr.png
    gethomepage.dev/pod-selector: "app=seerr"
    gethomepage.dev/widget.type: seerr
    gethomepage.dev/widget.url: http://seerr.jellyfin.svc.cluster.local
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SEERR_APIKEY}}"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "seerr.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: seerr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
