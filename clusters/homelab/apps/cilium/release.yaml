---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Talos runs KubePrism (a local load-balancing proxy to the real
    # apiserver) on every node at 127.0.0.1:7445 by default - pointing
    # here instead of a specific control-plane node's raw IP is Cilium's
    # own documented recommended pattern for Talos, specifically to avoid
    # hardcoding a single node's address into the CNI's control
    # connection. Previously pinned to talos-cp1's IP directly
    # (10.200.0.52:6443): every kube-apiserver restart (even without the
    # node's IP changing) left Cilium's own tracked backend for the
    # in-cluster kubernetes Service (10.96.0.1:443) stuck refusing
    # traffic with "no route to host", even though `cilium-dbg service
    # list` always showed the correct backend - only a full cilium-agent
    # restart cleared it (confirmed live, twice, during the v1.13.8
    # upgrade). Root cause looks like Cilium's own client connection to
    # that fixed address not reconnecting cleanly after the backend
    # drops, rather than anything wrong with the routing table itself.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    operator:
      replicas: 1
    l2announcements:
      enabled: true
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true
