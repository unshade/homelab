---
# Exposes qbittorrent's WebUI on the tailnet as
# https://qbittorrent.moose-pogona.ts.net, separate from the public
# envoy-gateway/HTTPRoute path jellyfin itself uses (route.yaml) - this
# stays tailnet-only, no public DNS/route involved.
#
# ingressClassName: tailscale hands this Ingress to the tailscale operator
# instead of envoy-gateway. spec.tls[0].hosts[0] sets the MagicDNS name
# explicitly - confirmed against the operator's own source
# (cmd/k8s-operator/ingress.go, hostnameForIngress()): without it, the
# hostname defaults to "<namespace>-<name>-ingress"
# (jellyfin-qbittorrent-ingress), which works but is uglier.
#
# Requires HTTPS Certificates enabled in the Tailscale admin console
# (Settings -> General) - the operator logs a warning and the cert
# provisioning fails silently otherwise.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  annotations:
    # homepage (apps/homepage) - no rule sets spec.rules[].host (only the
    # TLS SNI host below), so href is set explicitly rather than relying on
    # homepage's usual host-derived link.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: qBittorrent
    gethomepage.dev/description: Torrent client (tailnet-only)
    gethomepage.dev/group: Media
    gethomepage.dev/icon: qbittorrent.png
    gethomepage.dev/href: https://qbittorrent.moose-pogona.ts.net
    gethomepage.dev/pod-selector: "app=qbittorrent"
    gethomepage.dev/widget.type: qbittorrent
    gethomepage.dev/widget.url: http://qbittorrent.jellyfin.svc.cluster.local:8080
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_QBITTORRENT_APIKEY}}"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - qbittorrent
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
