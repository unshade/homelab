---
# Dedicated instance, same as every other app here (e.g. immich's own
# valkey) rather than trying to share one across namespaces - it's just
# Sidekiq's job queue, not worth the cross-app coupling.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-redis
spec:
  storageClassName: longhorn-single-replica
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-redis
  labels:
    app: dawarich-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich-redis
  template:
    metadata:
      labels:
        app: dawarich-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          # Matches upstream's own docker-compose command - no AOF, periodic
          # RDB snapshots only. This is just a job queue, not durable state.
          args:
            - redis-server
            - --save
            - "900 1"
            - --save
            - "300 10"
            - --appendonly
            - "no"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dawarich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich-redis
spec:
  ports:
    - name: redis
      port: 6379
  selector:
    app: dawarich-redis
