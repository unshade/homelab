---
# NFS doesn't hard-enforce this size the way block storage does — the real
# ceiling is whatever the ZFS pool actually has. This is a nominal request,
# not a reservation. Adjust freely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Ti
  # Explicit, even though media-pv.yaml's claimRef alone is enough to bind here
  # instead of dynamically provisioning a fresh volume - this makes the pairing
  # obvious from this file alone, not just from reading the PV's side of it.
  volumeName: jellyfin-media
