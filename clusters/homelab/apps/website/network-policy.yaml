apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: website
spec:
  podSelector:
    matchLabels:
      app: website
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gatewayclass: main
      ports:
        - port: 8080
          protocol: TCP
