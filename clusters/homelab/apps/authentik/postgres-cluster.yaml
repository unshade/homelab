apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: longhorn-strict-local
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
  resources:
    requests:
      # Actual usage: ~35m cpu, 107-240Mi mem across both instances - the
      # old 500m/512Mi request was way oversized on both axes. Matches
      # general-postgres's already-proven sizing.
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
