---
# Read-only, cluster-wide - homepage's Kubernetes provider (kubernetes.yaml)
# lists namespaces/pods/nodes for the pod-selector health dot and the
# cluster/nodes widget, HTTPRoutes for gethomepage.dev/* annotation
# discovery on public services, and Ingresses for the same on tailnet-only
# ones (services.yaml stays empty on purpose - see kustomization.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, gateways]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
