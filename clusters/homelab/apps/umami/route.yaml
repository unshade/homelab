---
# Public on purpose - no authentik forward-auth SecurityPolicy (unlike
# apps/jellystat): tracked sites' visitors' browsers must reach /script.js
# and /api/send anonymously. The dashboard is protected by Umami's own login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "stats.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
