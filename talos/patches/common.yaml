# Shared Talos machine config patch, applied to every node via
# `--config-patch @patches/common.yaml` on `talosctl gen config` (see
# README's "Changing the machine config" section for the exact commands).
#
# Deliberately minimal: only fields that talosctl gen config does NOT already
# default to (verified live, by generating a config with no patches at all
# and diffing against this) are listed here. kubelet.image/
# defaultRuntimeSeccompProfileEnabled/disableManifestsDirectory,
# features.diskQuotaSupport/kubePrism/hostDNS, install.wipe/
# grubUseUKICmdline, nodeLabels, and the k8s component apiServer/
# controllerManager/scheduler/proxy image pins are all already talosctl's
# own defaults - restating a default here wouldn't be a no-op, since
# `--config-patch` merges into lists rather than replacing them (that's
# what caused the admissionControl duplication bug, below).
machine:
  kubelet:
    # Bind-mounts the /var/mnt/data SSD into the kubelet's own mount namespace
    # so hostPath-based pods (Longhorn's engine/replica pods) can actually see
    # it - paths on the Talos host aren't visible inside the kubelet container
    # otherwise.
    extraMounts:
      - destination: /var/mnt/data
        type: bind
        source: /var/mnt/data
        options:
          - bind
          - rshared
          - rw
  install:
    disk: /dev/sda
    # Custom schematic (see schematic.yaml): qemu-guest-agent + iscsi-tools +
    # util-linux-tools (iscsi/util-linux for Longhorn). Resolved by hand
    # against factory.talos.dev - see README for the exact command to
    # re-resolve this if schematic.yaml ever changes, or for a node that
    # needs a different extension set.
    image: factory.talos.dev/installer/53513e54bb39202f35694412577a6bc53d484744d35a126e5d42ef34785c0d83:v1.13.8
cluster:
  network:
    cni:
      name: none # Cilium is installed via Flux HelmRelease instead.
  proxy:
    disabled: true # Cilium runs in kube-proxy-replacement mode instead.
  # Allows running workload on control-plane nodes - both nodes are, there
  # are no separate workers.
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      # Decouples the service-account token issuer from
      # cluster.controlPlane.endpoint (which Talos derives --service-account-
      # issuer/--api-audiences from by default otherwise) - permanently
      # stable from here on, using kube-apiserver's own upstream default
      # value (what plain kubeadm leaves it as, unless overridden - it's
      # just an identity string compared inside already-validated tokens,
      # never actually fetched, so it doesn't need to be a real address the
      # way cluster.controlPlane.endpoint genuinely does).
      #
      # This was meant to be a gradual, zero-downtime multi-issuer migration
      # (old value first/primary, new value added second/accepted-only, per
      # kube-apiserver's own documented behavior and the kOps service-
      # account-issuer-migration guide) - NOT POSSIBLE on this Talos version:
      # confirmed live, both --config-patch and machineconfig patch reject a
      # list-valued extraArgs entry outright (decoder error: "unexpected
      # type for yaml sequence: v1alpha1.ArgValue"), and this is a known,
      # unfixed upstream regression (siderolabs/talos#12210, broken since
      # v1.12, closed as not planned) - not something fixable by better
      # patch syntax. A single string value patches fine, confirmed - only
      # multi-value lists are broken.
      #
      # So this is a direct, single-shot swap instead: every existing
      # service-account token becomes invalid the moment this applies
      # (confirmed live the first time this was attempted with a different
      # value, by accident - see router/README.md's Phase 3 notes for the
      # full incident writeup). Done deliberately this time, with the fix
      # already staged and fired immediately: Cilium agents restarted (their
      # own tracked kubernetes-service backend goes stale on any apiserver
      # restart, separate known gotcha) and every real API-calling pod
      # force-deleted in the same pass, rather than waiting on kubelet's own
      # slow natural token-refresh cycle.
      service-account-issuer: https://kubernetes.default.svc.cluster.local
      # api-audiences ALSO derives from cluster.controlPlane.endpoint by
      # default, independently of service-account-issuer above and
      # invisible in any config-file diff (Talos computes it internally,
      # never rendering it as text anywhere until the live static pod
      # manifest) - found this out the hard way, live, when changing
      # cluster.controlPlane.endpoint alone still invalidated every token
      # cluster-wide because of this exact flag (see router/README.md's
      # Phase 3 notes for the full second-incident writeup).
      #
      # Was pinned to its then-CURRENT value first (a true no-op step,
      # confirmed live), *before* cluster.controlPlane.endpoint was changed -
      # see router/README.md's Phase 3 for why that ordering mattered. Now
      # advanced to the same permanently-stable value as service-account-
      # issuer above, its own deliberate single-shot swap (same Talos
      # limitation applies here too - single value patches fine, this field
      # can't do the gradual multi-value dance either): every existing
      # token's audience claim stops matching the moment this applies, fixed
      # immediately with the same staged recovery (Cilium agent restart +
      # every real API-calling pod force-deleted, rebuilt fresh from live
      # RBAC bindings each time rather than reusing a stale list).
      api-audiences: https://kubernetes.default.svc.cluster.local
---
apiVersion: v1alpha1
kind: UserVolumeConfig
# Name of the volume - determines the mount path (/var/mnt/<name>). Identical
# on both nodes today.
name: data
provisioning:
  diskSelector:
    # Matches the disk Talos is NOT installed on (the 430GB data disk) -
    # stable even if device naming shifts, since sda is always the system
    # disk.
    match: '!system_disk'
  minSize: 400GB
filesystem:
  type: xfs
