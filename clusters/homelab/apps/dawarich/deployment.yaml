---
# web + sidekiq as two containers of one pod (not two Deployments) so both
# can share the public/watched/storage PVCs over plain ReadWriteOnce -
# they're always on the same node this way, no need for RWX/NFS.
#
# Deliberately NOT runAsNonRoot/runAsUser at pod or container level, unlike
# most other apps here - both entrypoints (docker/web-entrypoint.sh,
# docker/sidekiq-entrypoint.sh) only chown the mounted volumes to PUID/PGID
# and gosu down to that user when they start as root; upstream's own
# comment is explicit: "Prefer this over compose `user:`, which starts
# unprivileged and cannot chown root-owned volumes." Forcing non-root here
# would skip that chown and very likely reproduce the homepage/proxmox.yaml
# EACCES issue. capabilities aren't dropped for the same reason - gosu
# needs CAP_SETUID/CAP_SETGID to drop to PUID/PGID at all.
#
# The image's own ENTRYPOINT is just ["bundle", "exec"] - docker-compose.yml
# overrides it per-service (entrypoint: web-entrypoint.sh /
# sidekiq-entrypoint.sh), so command/args below do the same via Kubernetes'
# command (= docker entrypoint) / args (= docker command) split.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  labels:
    app: dawarich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dawarich
  template:
    metadata:
      labels:
        app: dawarich
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: web
          image: freikin/dawarich:1.14.2@sha256:5de477cfc6f8d9d19d7660c262acb196ea8a15cebbcbb7db173e04a2860f3bb5
          command: ["web-entrypoint.sh"]
          args: ["bin/rails", "server", "-p", "3000", "-b", "::"]
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RAILS_ENV
              value: production
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: TIME_ZONE
              value: Europe/Paris
            - name: REDIS_URL
              value: redis://dawarich-redis.dawarich.svc.cluster.local:6379
            - name: DATABASE_HOST
              value: general-postgres-rw.postgres.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: dawarich
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: postgres-password
            - name: DATABASE_NAME
              value: dawarich
            - name: APPLICATION_HOSTS
              value: dawarich.nstnr.com
            - name: APPLICATION_PROTOCOL
              value: http
            - name: SELF_HOSTED
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: secret-key-base
            # OIDC - Authentik is the only login path (see
            # secret-sops.yaml for the Provider setup this depends on).
            - name: OIDC_ISSUER
              value: https://auth.nstnr.com/application/o/dawarich/
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.nstnr.com/users/auth/openid_connect/callback
            - name: OIDC_PROVIDER_NAME
              value: Authentik
            - name: OIDC_AUTO_REGISTER
              value: "true"
            - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
              value: "false"
            - name: ALLOW_EMAIL_PASSWORD_LOGIN
              value: "false"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: oidc-client-secret
            - name: WEB_CONCURRENCY
              value: "1"
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: public
              mountPath: /var/app/public
            - name: watched
              mountPath: /var/app/tmp/imports/watched
            - name: storage
              mountPath: /var/app/storage
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
        - name: sidekiq
          image: freikin/dawarich:1.14.2@sha256:5de477cfc6f8d9d19d7660c262acb196ea8a15cebbcbb7db173e04a2860f3bb5
          command: ["sidekiq-entrypoint.sh"]
          args: ["sidekiq"]
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: RAILS_ENV
              value: production
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: TIME_ZONE
              value: Europe/Paris
            - name: REDIS_URL
              value: redis://dawarich-redis.dawarich.svc.cluster.local:6379
            - name: DATABASE_HOST
              value: general-postgres-rw.postgres.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USERNAME
              value: dawarich
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: postgres-password
            - name: DATABASE_NAME
              value: dawarich
            - name: APPLICATION_HOSTS
              value: dawarich.nstnr.com
            - name: APPLICATION_PROTOCOL
              value: http
            - name: SELF_HOSTED
              value: "true"
            - name: STORE_GEODATA
              value: "true"
            - name: RAILS_LOG_TO_STDOUT
              value: "true"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: secret-key-base
            - name: OIDC_ISSUER
              value: https://auth.nstnr.com/application/o/dawarich/
            - name: OIDC_REDIRECT_URI
              value: https://dawarich.nstnr.com/users/auth/openid_connect/callback
            - name: OIDC_PROVIDER_NAME
              value: Authentik
            - name: OIDC_AUTO_REGISTER
              value: "true"
            - name: ALLOW_EMAIL_PASSWORD_REGISTRATION
              value: "false"
            - name: ALLOW_EMAIL_PASSWORD_LOGIN
              value: "false"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dawarich-secrets
                  key: oidc-client-secret
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "3"
          volumeMounts:
            - name: public
              mountPath: /var/app/public
            - name: watched
              mountPath: /var/app/tmp/imports/watched
            - name: storage
              mountPath: /var/app/storage
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - sidekiq
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1500Mi
      volumes:
        - name: public
          persistentVolumeClaim:
            claimName: dawarich-public
        - name: watched
          persistentVolumeClaim:
            claimName: dawarich-watched
        - name: storage
          persistentVolumeClaim:
            claimName: dawarich-storage
