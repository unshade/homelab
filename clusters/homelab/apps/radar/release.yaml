---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: radar
spec:
  interval: 1h
  chart:
    spec:
      chart: radar
      version: 1.18.2
      sourceRef:
        kind: HelmRepository
        name: radar
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Chart defaults kept mostly as-is - already security-conscious out of the
  # box (RBAC: helm/viewRBAC/viewWebhooks/podExec all off, readOnlyRoot
  # Filesystem, non-root, timeline in memory not sqlite).
  #
  # Now exposed on the tailnet behind Authentik (Proxy mode, same pattern as
  # Longhorn - see apps/authentik/ for the Ingress pointing at
  # authentik-server, which handles the whole auth-check + proxy job before
  # traffic ever reaches this Service). Because Authentik intercepts
  # everything for that hostname, auth.mode here can stay "none" - unauthed
  # requests never reach this pod at all, so Radar doesn't need to gate
  # access itself. auth.mode: proxy would additionally surface *who* made
  # each request inside Radar's own UI/timeline (via X-Forwarded-User/
  # X-Forwarded-Groups, which Authentik's outpost forwards as
  # X-authentik-username/X-authentik-groups) - worth revisiting later, not
  # required for access control.
  #
  # rbac.secrets: true - explicit tradeoff, not a default: K8s RBAC can't
  # scope to just Helm's release secrets, so this is genuinely all-Secrets
  # read access, cluster-wide. Chosen over rbac.helm: true (which implies
  # this AND adds full write access, enabling install/upgrade/rollback from
  # Radar's UI, bypassing the normal git-commit -> Flux-reconcile flow this
  # repo otherwise always goes through) - this repo doesn't want that path.
  #
  # rbac.portForward: true - lets Radar's UI open pods/portforward
  # subresource connections (used its own "Connect"/port-forward feature,
  # hit live: "cannot create resource pods/portforward ... in namespace
  # kube-system"). Narrower than the two flags above: it tunnels network
  # traffic to a pod's existing port, no read/write access to cluster
  # objects themselves.
  #
  # additionalRules: patch on Deployments/StatefulSets/DaemonSets - backs
  # Radar's "Restart workload" button (a rollout restart is just a patch
  # bumping the kubectl.kubernetes.io/restartedAt pod-template annotation;
  # hit live: "cannot patch resource deployments ... in namespace
  # jellyfin"). The chart has no dedicated flag for this. Tradeoff: K8s
  # RBAC can't restrict *which* fields a patch touches, so this is
  # technically full spec write on those kinds (image, replicas, ...) -
  # though anything diverging from git gets reverted by Flux's next
  # reconcile anyway. No create/delete, no scale subresource.
  values:
    rbac:
      secrets: true
      portForward: true
      additionalRules:
        - apiGroups: ["apps"]
          resources:
            - deployments
            - statefulsets
            - daemonsets
          verbs: ["patch"]
