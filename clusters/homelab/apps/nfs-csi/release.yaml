---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: csi-driver-nfs
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.4
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # storageClass.create is deliberately false: `storage.k8s.io/v1
    # StorageClass.parameters` is immutable after creation, so Helm can never
    # actually change `server` on an existing release - confirmed live, an
    # upgrade attempting it was rejected outright and Flux auto-rolled-back in
    # a loop, burning through several release revisions before this got
    # caught. The StorageClass is hand-written instead, in storage-class.yaml
    # - same directory, not Helm-managed, so it can be deleted and recreated
    # (the only real way to change an immutable field) without fighting Helm
    # over ownership.
    storageClass:
      create: false
