---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  # Pinned explicitly (same reasoning as envoy-gateway/immich) - Grafana's
  # own service name and OIDC redirect_uri assume "kube-prometheus-stack-*"
  # resource names, which the chart derives from .Release.Name.
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.21.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Talos-specific: Cilium runs full kube-proxy replacement (no kube-proxy
    # exists at all), and kube-controller-manager/kube-scheduler/etcd have no
    # discoverable Endpoints in kube-system on this cluster (confirmed live,
    # unlike kubeadm-style clusters this chart assumes by default) - disabled
    # to avoid permanently-empty scrape targets rather than guess they'd work.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

    prometheus:
      prometheusSpec:
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-strict-local
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-strict-local
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        type: pvc
        storageClassName: longhorn-strict-local
        size: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      route:
        main:
          enabled: true
          parentRefs:
            - name: main
              namespace: envoy-gateway-system
              sectionName: https
          hostnames:
            - grafana.nstnr.com
      # client_secret uses Grafana's variable-expansion syntax (never a
      # literal value in this file/the rendered ConfigMap) - the actual
      # secret is injected as an env var below, sourced from the SOPS
      # secret. FILL IN client_id once the Authentik OAuth2/OpenID
      # provider + application exist (redirect_uri below is exactly what
      # to register). grafana-oidc-credentials' client-secret also needs
      # its real value - see secret-sops.yaml.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc-credentials
            key: client-secret
      grafana.ini:
        server:
          root_url: https://grafana.nstnr.com
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: "Y1oV04g3jIVBmd1pkDXaZBaxBgjXTLZQsJEH2QQM"
          client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
          scopes: "openid profile email"
          auth_url: https://auth.nstnr.com/application/o/authorize/
          token_url: https://auth.nstnr.com/application/o/token/
          api_url: https://auth.nstnr.com/application/o/userinfo/
          redirect_uri: https://grafana.nstnr.com/login/generic_oauth
          use_pkce: true
          allow_sign_up: true
          # Single-user homelab - anyone who can authenticate via Authentik
          # gets Editor rights, no group-based role mapping.
          auto_assign_org_role: Editor
