machine:
  network:
    interfaces:
      # Full cutover, matching w-1/pve0: no address at all anymore. Kept as an
      # explicit interface entry (dhcp: false, no addresses) rather than
      # omitted entirely, so it can't accidentally pick up a DHCP lease from
      # the old network it's still physically on (via nas's vmbr0) - stays
      # up, stays inert, on purpose. Confirmed live before this change that
      # nothing referenced 192.168.1.252 anymore: controlPlane.endpoint,
      # apiServer extraArgs, Cilium's k8sServiceHost, kubeconfig/talosctl,
      # and the talos-cp1.lan/talos-api.lan DNS records were all already on
      # 10.200.0.52 - see router/README.md's Cutover checklist Phase 3 for
      # the full history of how this address stopped being load-bearing.
      - interface: ens18
        dhcp: false
      # New network (10.200.0.0/24, behind the Mikrotik) - now the primary
      # interface: carries both the default route and the WireGuard-subnet
      # route added earlier (10.200.255.0/24 - a *different* subnet from the
      # LAN this interface is directly connected to, so still needs its own
      # explicit route even now that the default route also lives here).
      - interface: ens19
        addresses:
          - 10.200.0.52/24
        dhcp: false
        routes:
          - network: 0.0.0.0/0
            gateway: 10.200.0.1
          - network: 10.200.255.0/24
            gateway: 10.200.0.1
    nameservers:
      - 10.200.0.1
      - 1.1.1.1
      - 1.0.0.1
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: talos-cp1
