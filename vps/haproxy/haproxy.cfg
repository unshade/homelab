global
    maxconn 4096

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log stdout format raw local0
    option tcplog

frontend https_in
    bind *:443
    default_backend cluster_https

frontend http_in
    bind *:80
    default_backend cluster_http

# No SNI-based routing needed - every hostname (auth, jellyfin, radarr,
# sonarr, seerr, prowlarr, immich, ...) already routes to the same single
# Envoy Gateway backend on the cluster side. send-proxy-v2 tags each
# connection with the real client IP; the in-cluster wireguard pod's own
# HAProxy reads it and re-tags its own connection to Envoy, so the original
# client IP survives both hops.
backend cluster_https
    server cluster 10.10.10.1:443 send-proxy-v2 check

backend cluster_http
    server cluster 10.10.10.1:80 send-proxy-v2 check
