machine:
  network:
    interfaces:
      # Deliberately left in place, no longer carrying the default route - the
      # rollback path if ens19/the new network ever has a problem. Not part of
      # any dynamic routing here, so this is genuinely inert unless something
      # is explicitly pointed at 192.168.1.252 (nothing is, as of this change -
      # see router/README.md's Cutover checklist, Phase 3).
      - interface: ens18
        addresses:
          - 192.168.1.252/24
        dhcp: false
      # New network (10.200.0.0/24, behind the Mikrotik) - now the primary
      # interface: carries both the default route and the WireGuard-subnet
      # route added earlier (10.200.255.0/24 - a *different* subnet from the
      # LAN this interface is directly connected to, so still needs its own
      # explicit route even now that the default route also lives here).
      - interface: ens19
        addresses:
          - 10.200.0.52/24
        dhcp: false
        routes:
          - network: 0.0.0.0/0
            gateway: 10.200.0.1
          - network: 10.200.255.0/24
            gateway: 10.200.0.1
    nameservers:
      - 10.200.0.1
      - 1.1.1.1
      - 1.0.0.1
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: talos-cp1
