---
# Dedicated cluster (not the shared general-postgres) — Dawarich needs the
# PostGIS extension for its geospatial data, which the shared cluster's
# stock postgres image doesn't have. Same reasoning/pattern as
# apps/immich/postgres-cluster.yaml (vchord there, postgis here) - CNPG's
# declarative ImageVolume extension mechanism, straight from PostGIS's own
# reference manifest: https://cloudnative-pg.io/docs/devel/postgis/
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dawarich-postgres
spec:
  instances: 3
  storage:
    size: 10Gi
    storageClass: longhorn-single-replica
  # "standard" (not "minimal") - Dawarich's schema also enables pgcrypto,
  # a bundled contrib extension the minimal image strips out.
  # renovate: datasource=docker
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  postgresql:
    extensions:
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.2-18-trixie
        ld_library_path:
          - system
  bootstrap:
    initdb:
      database: dawarich
      owner: dawarich
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
---
# initdb above already creates the "dawarich" database/role; this layers
# the extensions Dawarich's schema.rb enables on top (same dual-declaration
# pattern as apps/immich's postgres-cluster.yaml).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dawarich-database
spec:
  cluster:
    name: dawarich-postgres
  name: dawarich
  owner: dawarich
  databaseReclaimPolicy: retain
  extensions:
    - name: postgis
      ensure: present
    - name: pgcrypto
      ensure: present
