# Widget API keys, exposed to the container as HOMEPAGE_VAR_* env vars and
# referenced from the target apps' HTTPRoute annotations as
# gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_...}}" (homepage substitutes
# {{HOMEPAGE_VAR_XXX}} in any config value with env var HOMEPAGE_VAR_XXX).
#
# These are placeholders - none of these apps store their API key as a
# Secret anywhere else in this repo (they're generated inside each app on
# first run), so there's nothing to pull in automatically. Fill in the real
# values with `sops clusters/homelab/apps/homepage/secret-sops.yaml`:
#   RADARR_APIKEY/SONARR_APIKEY/PROWLARR_APIKEY: Settings > General > Security
#   JELLYFIN_APIKEY:  Dashboard > API Keys (create one)
#   SEERR_APIKEY:     Settings > General > API Key
#   IMMICH_APIKEY:    Account Settings > API Keys (needs server.statistics)
#   AUTHENTIK_APIKEY: Admin Portal > Directory > Tokens & App passwords,
#                      Intent "API Token", on an account with global View
#                      Users/Events permissions (not the bootstrap token -
#                      keep that scoped to bootstrap, not day-to-day use)
# Until filled in, the corresponding widgets show an auth error rather than
# breaking the whole page - failOpen/other services are unaffected.
apiVersion: v1
kind: Secret
metadata:
    name: homepage-secrets
type: Opaque
stringData:
