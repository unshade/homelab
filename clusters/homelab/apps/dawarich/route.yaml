---
# No security-policy.yaml here, unlike radarr/sonarr/prowlarr/jellystat -
# Dawarich authenticates itself via OIDC straight to Authentik (see
# secret-sops.yaml), the same "native auth, no forward-auth" pattern as
# apps/immich. Layering forward-auth on top would just be a second,
# redundant login in front of the one Dawarich already does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dawarich
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Dawarich
    gethomepage.dev/description: Location history
    gethomepage.dev/group: Media
    gethomepage.dev/icon: dawarich.png
    gethomepage.dev/pod-selector: "app=dawarich"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "dawarich.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: dawarich
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
