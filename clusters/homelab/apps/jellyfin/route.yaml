---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "jellyfin.nstnr.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: block-metrics
    - backendRefs:
        - group: ""
          kind: Service
          name: jellyfin
          port: 80
          weight: 1
      # No timeout: streaming a film is a single long-lived response, and any
      # finite budget here truncates it.
      timeouts:
        request: 18000s
        backendRequest: 18000s
      matches:
        - path:
            type: PathPrefix
            value: /
