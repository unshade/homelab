---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Sonarr
    gethomepage.dev/description: TV collection manager
    gethomepage.dev/group: Media
    gethomepage.dev/icon: sonarr.png
    gethomepage.dev/pod-selector: "app=sonarr"
    gethomepage.dev/widget.type: sonarr
    gethomepage.dev/widget.url: http://sonarr.jellyfin.svc.cluster.local
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_APIKEY}}"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "sonarr.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: sonarr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
