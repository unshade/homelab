---
title: nstnr
theme: dark
color: indigo
headerStyle: boxedWidgets
hideVersion: true
statusStyle: dot
useEqualHeights: true
fullWidth: true
# Background image is config/images/background.jpg, mounted at
# /app/public/images/background.jpg - see deployment.yaml and
# kustomization.yaml's configMapGenerator. opacity-only (no blur/
# saturate/brightness) because those are mutually exclusive with
# cardBlur below - see gethomepage.dev/configs/settings under
# "Card Background Blur".
background:
  image: /images/background.jpg
  opacity: 80
cardBlur: md
layout:
  Media:
    style: row
    columns: 3
  Photos:
    style: row
    columns: 4
  Identity:
    style: row
    columns: 4
  Site:
    style: row
    columns: 4
