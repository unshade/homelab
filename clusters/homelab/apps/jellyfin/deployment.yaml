---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  # jellyfin-config is ReadWriteOnce - RollingUpdate tries to start the new
  # pod before killing the old one, which deadlocks forever on that volume
  # (new pod stuck ContainerCreating since the old pod still holds the RWO
  # attachment). Recreate tears down the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
          resources:
            requests:
              # Idle actual usage is ~425Mi - the old 1Gi request was
              # >2x that. Limit left generous for active transcode bursts.
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 5Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
        - name: cache
          # Transcode scratch space — disposable, high-churn, deliberately
          # not on network-replicated storage. sizeLimit stops a long
          # transcode session from filling up the node's own disk.
          emptyDir:
            sizeLimit: 20Gi
