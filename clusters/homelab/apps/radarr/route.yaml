---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Radarr
    gethomepage.dev/description: Movie collection manager
    gethomepage.dev/group: Arr Stack
    gethomepage.dev/icon: radarr.png
    gethomepage.dev/pod-selector: "app=radarr"
    gethomepage.dev/widget.type: radarr
    gethomepage.dev/widget.url: http://radarr.jellyfin.svc.cluster.local
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_RADARR_APIKEY}}"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "radarr.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: radarr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
