---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellystat
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Jellystat
    gethomepage.dev/description: Jellyfin statistics
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellystat.png
    gethomepage.dev/pod-selector: "app=jellystat"
    gethomepage.dev/widget.type: jellystat
    gethomepage.dev/widget.url: http://jellystat.jellyfin.svc.cluster.local
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYSTAT_APIKEY}}"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "jellystat.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: jellystat
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
