---
# Daily S3 backup for every volume - the "default" group applies
# automatically to any volume with no recurring job explicitly assigned
# (see recurring-job-group.longhorn.io/<name> / recurring-job.longhorn.io/
# <name> labels on Volume objects to opt a specific volume in/out of this
# or add it to a different group instead).
#
# 3am (low-traffic homelab hours), keep 30 daily backups. Backups go to
# apps/longhorn/backup-target.yaml (Infomaniak S3). 30 days, not 7 - cost
# is bounded by actual changed data (incremental + deduped within a
# volume's history, not a flat multiple of volume size - see the
# conversation this repo doesn't capture), and this homelab sometimes goes
# ~2 weeks untouched, so a shorter window risks every recovery point
# rotating out before a problem from before that gap gets noticed.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-daily
spec:
  cron: "0 3 * * *"
  task: backup
  groups:
    - default
  retain: 30
  concurrency: 2
