---
# Photo/video library — original assets, thumbnails, encoded video. NFS
# doesn't hard-enforce this size, same reasoning as jellyfin-media; nominal
# request, real ceiling is whatever the ZFS pool has. RWX since both the
# server and (potentially) other replicas need concurrent access.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  # Explicit pairing with library-pv.yaml's claimRef - see jellyfin/media-pvc.yaml's
  # comment for why both sides are set.
  volumeName: immich-library
