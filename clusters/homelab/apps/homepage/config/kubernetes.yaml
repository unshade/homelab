---
mode: cluster
# Public services are all Gateway API HTTPRoutes (Envoy Gateway) - but a
# few tailnet-only apps (qbittorrent, radar, longhorn) use a plain
# networking.k8s.io Ingress instead, handed to the Tailscale operator via
# ingressClassName: tailscale (see e.g. apps/jellyfin/
# qbittorrent-tailscale-ingress.yaml). Both need to be on for annotation
# discovery to see them - it stays opt-in per-resource either way
# (gethomepage.dev/enabled: "true").
ingress: true
traefik: false
gateway: true
