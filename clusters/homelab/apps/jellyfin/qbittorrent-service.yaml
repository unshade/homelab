---
# Plain ClusterIP - reachable from other pods (radarr/sonarr/prowlarr
# configuring it as a download client) via the Service's ClusterIP, same as
# any other in-cluster Service. Was NodePort for direct LAN access
# (<node-ip>:<nodePort>); dropped now that the WebUI is reachable via the
# tailscale Ingress (qbittorrent-tailscale-ingress.yaml) instead - no public
# route either way, this just narrows the exposure to tailnet-only.
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
spec:
  ports:
    - name: webui
      port: 8080
      targetPort: webui
  selector:
    app: qbittorrent
