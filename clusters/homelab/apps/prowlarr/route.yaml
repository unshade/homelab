---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Prowlarr
    gethomepage.dev/description: Indexer manager
    gethomepage.dev/group: Arr Stack
    gethomepage.dev/icon: prowlarr.png
    gethomepage.dev/pod-selector: "app=prowlarr"
    gethomepage.dev/widget.type: prowlarr
    gethomepage.dev/widget.url: http://prowlarr.jellyfin.svc.cluster.local
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PROWLARR_APIKEY}}"
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "prowlarr.nstnr.com"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: prowlarr
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
