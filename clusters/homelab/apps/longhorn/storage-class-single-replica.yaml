---
# One Longhorn replica, preferring the pod's own node (best-effort) but able
# to serve it from another node. Unused today; kept for data that's cheap to
# lose or rebuild (caches, scratch space) where a second copy isn't worth it.
#
# Not for databases - use longhorn-strict-local (storage-class.yaml): with a
# single replica, the volume is down whenever its node is, whatever the data
# locality, so best-effort gains nothing there and loses local-disk speed.
# Not the default either - see storage-class-replicated.yaml.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single-replica
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
