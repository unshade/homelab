---
# Cluster default: two Longhorn replicas on different nodes, so a volume
# survives one node going down and its pod can move during a drain. Right for
# regular app data (config volumes, uploads, ...) - any PVC without an
# explicit storageClassName lands here. Databases use longhorn-strict-local
# instead (storage-class.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "2"
