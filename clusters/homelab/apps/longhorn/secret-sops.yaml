# S3 backup target credentials for Longhorn - referenced by name from the
# Longhorn UI's Backup Target settings (Settings > General > Backup Target,
# or Backup and Restore > Backup Targets), field "Credential Secret". Must
# live in longhorn-system (this file's namespace, per kustomization.yaml).
#
# Fill in with `sops clusters/homelab/apps/longhorn/secret-sops.yaml`:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY - required.
#   AWS_ENDPOINTS - only for non-AWS S3-compatible providers (MinIO,
#     Backblaze B2, etc.) - e.g. https://s3.eu-central-003.backblazeb2.com.
#     Leave as REPLACE_ME (or delete the key) for real AWS S3.
#   AWS_CERT - only if the endpoint uses a self-signed/private CA cert.
#     Leave as REPLACE_ME (or delete the key) otherwise.
